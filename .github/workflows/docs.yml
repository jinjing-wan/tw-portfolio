name: Build & Deploy Docs

# Docs-as-Code 发布流水线：向 main 推送即自动构建并发布到 GitHub Pages。
# 站点地址：https://jinjing-wan.github.io/tw-portfolio/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个发布任务，避免并发写 Pages
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建 HTML
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装构建依赖
        run: pip install -r requirements.txt

      - name: 构建站点
        # 说明：此处不加 -W，避免个别告警阻断发布。
        # 若要把「0 warning」设为硬门槛，改为：
        #   sphinx-build -b html -W --keep-going docs docs/_build/html
        run: sphinx-build -b html docs docs/_build/html

      - name: 校验产物
        run: |
          test -f docs/_build/html/index.html
          test -f docs/_build/html/.nojekyll
          echo "产物文件数：$(find docs/_build/html -type f | wc -l)"

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
