name: Build & Deploy Docs

# Docs-as-Code 发布流水线：向 main 推送即自动构建并发布到 GitHub Pages。
# 站点地址：https://jinjing-wan.github.io/tw-portfolio/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个发布任务，避免并发写 Pages
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建 HTML
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装构建依赖
        run: pip install -r requirements.txt

      - name: 构建 API 参考子工程（api-docs）
        # 独立 Sphinx 工程：Doxygen XML + Breathe 渲染 C/C++ 接口契约，
        # 产出 objects.inv（供主站 intersphinx 跨项目引用）与静态 HTML。
        run: sphinx-build -b html api-docs api-docs/_build/html

      - name: 构建主站（docs）
        # 主站通过 intersphinx 引用 api-docs 的符号：构建时读取
        # ../api-docs/_build/html/objects.inv（相对 docs/conf.py），
        # 生成的链接前缀为 api/（api-docs 部署在主站 /api 子路径）。
        # 说明：此处不加 -W，避免个别告警阻断发布。
        # 若要把「0 warning」设为硬门槛，改为：
        #   sphinx-build -b html -W --keep-going docs docs/_build/html
        run: sphinx-build -b html docs docs/_build/html

      - name: 并入 API 文档到 /api 子路径
        # 把 api-docs 的静态 HTML 复制到主站 /api，使主站里的跨项目符号
        # 链接（api/xxx.html）在线上可跳转。objects.inv 也随之就位。
        run: |
          rm -rf docs/_build/html/api
          cp -r api-docs/_build/html docs/_build/html/api
          test -f docs/_build/html/.nojekyll || cp api-docs/_build/html/.nojekyll docs/_build/html/.nojekyll
          echo "已并入 API 文档 -> /api"

      - name: 校验产物
        run: |
          test -f docs/_build/html/index.html
          test -f docs/_build/html/.nojekyll
          echo "产物文件数：$(find docs/_build/html -type f | wc -l)"

      - name: 内部泄露校验
        # 防御性：解压公开站 objects.inv，确认没有内部版对象名混入
        # （误构建内部工程 / 内部内容串入公开页 会在此被拦下，避免随 Pages 泄露）。
        run: python scripts/check_internal_leak.py

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
